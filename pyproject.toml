[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mathub-material-extractor"
version = "0.1.0"
description = "Deterministic PDF ingestion and source-faithful extraction for the Mathub material pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
mathub-extract = "mathub_extractor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
