[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mathub-material-extractor"
version = "0.4.0"
description = "Deterministic PDF ingestion plus local semantic lesson retrieval for the Mathub material pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PyMuPDF>=1.26,<1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
semantic = [
    "numpy>=2,<3",
    "sentence-transformers>=3.4,<6",
]

[project.scripts]
mathub-extract = "mathub_extractor.cli:main"
mathub-locate = "mathub_extractor.locator_cli:main"
mathub-semantic = "mathub_extractor.semantic_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
